    first_fetch_sha256: "571238d7c871bbf7893d5344b8fada3a18617402edb3ba3c7a14994598f34a18"
    rate_limit_rps: 0.5
    contact_email: luckynyambi@gmail.com
    notes: >
      Parser fetches all 4 485 ward endpoints (/api/ward/{id}?v=1.48.0) using
      async httpx (8 concurrent workers). The SHA gates on the main page HTML;
      a site redeploy will bump the SHA and trigger a re-ingest. Ward IDs are
      IEC 8-digit codes derived from 213 muni prefixes in the layout JS bundle.
      Emits MPSeed(chamber='local') for every 2026 candidate plus the 2021
      election winner (portfolio='Sitting Councillor (2021)') per ward.

